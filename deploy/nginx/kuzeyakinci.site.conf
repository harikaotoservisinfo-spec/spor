# Kuzey Akıncı kişisel saha — statik site (diğer sitelere dokunmaz)
server {
    listen 80;
    listen [::]:80;
    server_name kuzeyakinci.site www.kuzeyakinci.site;

    root /var/www/kuzeyakinci.site;
    index index.html;

    access_log /var/log/nginx/kuzeyakinci.access.log;
    error_log /var/log/nginx/kuzeyakinci.error.log;

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location = /api/contact {
        proxy_pass http://127.0.0.1:9473;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64k;
    }

    location = /api/askf-fixture {
        proxy_pass http://127.0.0.1:9473;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}